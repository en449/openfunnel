name: CI

# Cheap insurance for a repo whose history is mostly security fixes: every push
# and every PR — including from forks — runs the same commands a maintainer
# runs locally. A green tick is not a security review, but it does stop a
# refactor from silently deleting a guard that a test asserts.
#
# `push` is deliberately unfiltered. It used to be `branches: [main]`, on the
# assumption that everything reaches main through a pull request and would be
# checked there — and a long-lived feature branch is the counterexample. On
# 2026-08-12 `phase-1-delivery-queue` had fourteen work orders on it and had
# never run CI once, so nobody knew the engine suite was 219/18 on a runner
# while being 236/1 on the machine that pushed it (PHASE-1-PLAN.md §4.8). CI
# that only watches the branch work has already landed on is insurance bought
# after the fire.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# head_ref on a pull_request is the branch name; ref_name on a push is the same
# string. Normalising them means a PR and the push that updated it share one
# group and the older run is cancelled, rather than both building because
# `github.ref` spells the same branch two different ways.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the packageManager field in package.json. Bump both together.
          bun-version: 1.3.14

      # --frozen-lockfile so a PR cannot pull a dependency the lockfile does not
      # already name. The tree is two devDependencies deep; there is no reason
      # for CI to resolve anything new.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Two tests log expected warnings (a missing branch target, an invalid-URL
      # submitLead). Those are assertions about failure tolerance — a clean log
      # here would mean the assertions stopped running.
      - name: Test
        run: bun test

  # The engine is shipped as source and imported straight from the browser, so a
  # bare-specifier import is a runtime 404 on a visitor's phone rather than a
  # build error anyone sees first. Nothing else enforces this invariant.
  engine-has-no-dependencies:
    name: engine stays zero-dependency
    runs-on: ubuntu-latest
    # Both steps take seconds; this is a runaway guard, not a budget. It was 5,
    # and a run where GitHub was slow to hand out a hosted runner burned the
    # whole allowance queueing and failed with "exceeded the maximum execution
    # time" — a red tick that had nothing to do with the code.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Assert no runtime dependencies anywhere
        run: bun run scripts/check-no-deps.mjs

      - name: Assert every engine import is relative
        run: bun run scripts/check-engine-imports.mjs

      - name: Assert the serverless path uses no Bun-only API
        run: bun run scripts/check-portable-runtime.mjs

  # PHASE-1-PLAN.md §4.8: the assertions in supabase/tests/ shipped with WO1,
  # were always correct, and nothing ran them for a day — the local dev
  # cluster drifted two migrations behind with nobody noticing, because the
  # only way to run these files was a five-command README recipe against a
  # cluster someone had to remember to start by hand. scripts/db-test.sh is
  # that recipe made runnable from a cold start; this job is what makes it
  # run on every push instead of when someone remembers.
  db-assertions:
    name: SQL assertions (state machine, OTP, targets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # scripts/db-test.sh applies migrations and then runs the assertion
        # files against a database it creates itself; both would race a
        # container that answers on the port before Postgres is actually
        # ready to accept connections. This blocks the job's steps until
        # `pg_isready` says otherwise.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      # No apt step: the runner image ships a psql client, so installing one
      # would be a second package for a script whose whole point is that it
      # needs nothing but psql and a server. That is an assumption about an
      # image we do not control — if it ever stops being true this job fails
      # on its first psql call, loudly and on the first push, which is when
      # you want to find out.
      - name: Run the assertion suite
        env:
          OF_TEST_PG_URL: postgres://postgres@localhost:5432/postgres
        run: ./scripts/db-test.sh
