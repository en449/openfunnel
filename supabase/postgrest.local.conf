# Standalone PostgREST for local development — see README.md.
#
# The Supabase CLI's local stack needs Docker, which this machine does not have.
# PostgREST is the one Supabase component the runtime actually talks to, so
# running it directly against a local Postgres gives the same interface with no
# container runtime.
#
# NOT A SECRET: the jwt-secret below is a fixed local-only string, and it is
# checked in on purpose so `supabase/tests/db-integration.mjs` can mint a
# matching token without configuration. Nothing signed with it has any authority
# outside a throwaway database on loopback. The real Supabase keys never live in
# a file in this repo.

db-uri     = "postgres://postgres@127.0.0.1:54399/of_dev"
db-schemas = "public"

# Locally there is no `service_role`; `postgres` is the superuser equivalent and
# bypasses RLS the same way. On the real project the runtime's service-role key
# does this, and the RLS policies (none, deliberately) deny everyone else.
db-anon-role = "postgres"

jwt-secret  = "local-dev-only-not-a-real-secret-32chars"
server-port = 4598
